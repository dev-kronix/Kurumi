<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="48%" stop-color="#14070c"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="800" height="4" patternUnits="userSpaceOnUse">
      <rect y="2" width="800" height="1" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="800" height="180" rx="18" fill="url(#bg)"/>
  <circle cx="400" cy="92" r="170" fill="url(#halo)"/>

  <!-- Marcadores de relógio -->
  <g stroke="#e11d48" stroke-width="2" opacity="0.6" transform="translate(400 90)">
    <line x1="0" y1="-72" x2="0" y2="-62"/>
    <line x1="72" y1="0" x2="62" y2="0"/>
    <line x1="0" y1="72" x2="0" y2="62"/>
    <line x1="-72" y1="0" x2="-62" y2="0"/>
    <circle r="72" fill="none" opacity="0.3"/>
    <line x1="0" y1="0" x2="31" y2="-35"/>
    <line x1="0" y1="0" x2="-11" y2="-50"/>
    <circle r="4" fill="#fda4af" stroke="none"/>
  </g>

  <!-- Nome principal -->
  <text x="400" y="108" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="72" font-weight="700"
        letter-spacing="10" fill="#fff1f2" filter="url(#glow)">
    KURUMI
    <animate attributeName="opacity" values="1;0.88;1" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <!-- Pequeno efeito de glitch -->
  <text x="403" y="108" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="72" font-weight="700"
        letter-spacing="10" fill="#e11d48" opacity="0">
    KURUMI
    <animate attributeName="opacity" values="0;0;0.25;0;0;0.12;0" dur="5s" repeatCount="indefinite"/>
  </text>

  <line x1="90" y1="142" x2="710" y2="142" stroke="#be123c" stroke-width="1" opacity="0.55"/>
  <text x="400" y="160" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="11" letter-spacing="4"
        fill="#fda4af" opacity="0.9">W H A T S A P P · B O T · P T - B R · v 8.1</text>

  <rect width="800" height="180" rx="18" fill="url(#scan)" opacity="0.38"/>
</svg>
